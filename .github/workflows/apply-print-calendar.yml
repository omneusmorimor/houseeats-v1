name: Apply monthly print calendar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Print calendar:') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire dedicated full-page print renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/ChefPage.tsx')
          s=p.read_text()
          if 'MonthlyPrintCalendar' not in s:
              s=s.replace('import MealRatingSummary from"../components/MealRatingSummary";','import MealRatingSummary from"../components/MealRatingSummary";import MonthlyPrintCalendar from"../components/MonthlyPrintCalendar";')
          pattern=r'{tab==="print"&&<section className="panel printSheet">.*?</section>}'
          replacement='{tab==="print"&&<section className="panel printSheet"><MonthlyPrintCalendar month={month} meals={meals} count={count} late={late}/><button onClick={()=>window.print()}>Print Full Month</button></section>}'
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Print renderer replacement failed: {n}')
          p.write_text(s)
          main=Path('src/main.tsx'); ms=main.read_text()
          if './monthly-print-calendar.css' not in ms:
              ms=ms.replace('import "./chef-warm-source.css";','import "./chef-warm-source.css";\nimport "./monthly-print-calendar.css";')
          main.write_text(ms)
          PY
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Commit wired renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ChefPage.tsx src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Print calendar: wire dedicated renderer'
          git push
